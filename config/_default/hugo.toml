baseURL = "https://peixy.xyz/"
locale = "zh-CN"
title = "peixy"
theme = "jingzhe_v3"

enableRobotsTXT = true
hasCJKLanguage = true
cleanDestinationDir = true

[module]
  [module.hugoVersion]
    extended = true
    min = "0.158.0"

[permalinks]
  posts = "/:slug/"

[markup]
  [markup.highlight]
    guessSyntax = true
    lineNos = false
    noClasses = false

  [markup.goldmark.renderer]
    unsafe = true

[taxonomies]
  category = "categories"
  tag = "tags"
  laodaotag = "laodaotags"

# Hugo 默认只允许模板读取 HUGO_ 前缀的环境变量（安全策略）。
# 地图令牌不进仓库，改由 Cloudflare 构建变量 MAPBOX_TOKEN 注入，模板用
# os.Getenv "MAPBOX_TOKEN" 读取，所以要把这个名字加进白名单。
# 见 themes/jingzhe_v3/layouts/zouguo.html
[security.funcs]
  getenv = ['^HUGO_', '^CI$', '^MAPBOX_TOKEN$']

[related]
  includeNewer = true
  threshold = 80
  toLower = true

  [[related.indices]]
    name = "laodaotags"
    weight = 100

  [[related.indices]]
    name = "date"
    pattern = "200601"
    weight = 10

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS", "JSON"]

[menu]
  [[menu.main]]
    identifier = "home"
    name = "首页"
    url = "/"
    weight = 1
  [[menu.main]]
    identifier = "posts"
    name = "随笔"
    url = "/posts/"
    weight = 2
