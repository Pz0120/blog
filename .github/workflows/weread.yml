name: 同步微信读书书架

on:
  schedule:
    - cron: '30 20 * * *'     # UTC 20:30 = 北京时间每天 04:30
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-weread
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Pillow（用于从封面提取书脊配色）
        run: pip install pillow

      - name: 同步书架数据
        env:
          WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
        run: python sync_books.py

      - name: 提交变化
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/books.json
          if git diff --staged --quiet; then
            echo "没有变化"
          else
            git commit -m "chore: 同步微信读书书架数据"
            git push
          fi
