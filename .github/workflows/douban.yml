name: 同步豆瓣观影

on:
  schedule:
    - cron: '0 20 * * *'      # UTC 20:00 = 北京时间每天 04:00
  workflow_dispatch:           # 也可以手动触发

permissions:
  contents: write

concurrency:
  group: sync-douban
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 同步观影数据
        env:
          DOUBAN_ID: ${{ vars.DOUBAN_ID }}
        run: python sync_movies.py

      - name: 提交变化
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/movies.json
          if git diff --staged --quiet; then
            echo "没有变化"
          else
            git commit -m "chore: 同步豆瓣观影数据"
            git push
          fi
